<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor de Ajedrez IA</title>

  <!-- CSS de Chessboard.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

  <!-- Estilos embebidos directamente para garantizar que carguen -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .main-wrapper {
      max-width: 800px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    /* Contenedor Principal Lado a Lado */
    .game-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
    }

    /* LIMITAR TAMAÑO DEL TABLERO */
    .board-column {
      width: 400px !important;
      max-width: 400px !important;
      flex: 0 0 400px !important;
    }

    #board {
      width: 400px !important;
      height: 400px !important;
    }

    /* Ajustar imágenes para evitar superzoom */
    #board img {
      max-width: 100% !important;
      max-height: 100% !important;
    }

    /* Columna del Menú Lateral */
    .panel-column {
      flex: 1;
      min-width: 250px;
      background-color: #2b2b36;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .status-card {
      background-color: #383846;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }

    .eval-box {
      margin-top: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #4da6ff;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    select {
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      background-color: #4a4a5a;
      color: #fff;
      font-size: 0.95rem;
    }

    .button-grid {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-icon {
      flex: 1;
      padding: 8px;
      font-size: 1.1rem;
      background-color: #383846;
      border: 1px solid #4a4a5a;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-icon:hover {
      background-color: #4a4a5a;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #4a4a5a;
      color: white;
    }

    .btn:hover {
      filter: brightness(1.2);
    }

    .btn-warning {
      background-color: #e07a5f;
    }

    .btn-danger {
      background-color: #e63946;
    }

    @media (max-width: 700px) {
      .game-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e24">
  <script>
  if ('serviceWorker' in navigator) {
    // Usar ./sw.js asegura que busque el archivo en la subcarpeta actual
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
      .catch(err => console.error('Error al registrar Service Worker:', err));
  }
</script>
</head>
<body>

  <div class="main-wrapper">
    <h1>Ajedrez IA Engine</h1>

    <!-- Contenedor Principal -->
    <div class="game-container">
      
      <!-- Tablero a la izquierda -->
      <div class="board-column">
        <div id="board"></div>
      </div>

      <!-- Panel a la derecha -->
      <div class="panel-column">
        <div class="status-card">
          <div id="status">Estado: Turno de las Blancas</div>
          <div class="eval-box">Evaluación: <span id="eval">0.0</span></div>
        </div>

        <div class="control-group">
          <label for="user-color">Jugar con:</label>
          <select id="user-color">
            <option value="w">Blancas</option>
            <option value="b">Negras</option>
          </select>
        </div>

        <div class="button-grid">
          <button id="btn-first" class="btn-icon" title="Inicio">⏮️</button>
          <button id="btn-prev" class="btn-icon" title="Anterior">◀️</button>
          <button id="btn-next" class="btn-icon" title="Siguiente">▶️</button>
          <button id="btn-last" class="btn-icon" title="Final">⏭️</button>
        </div>

        <div class="action-buttons">
          <button id="btn-flip" class="btn">🔄 Girar Tablero</button>
          <button id="btn-ai" class="btn">🤖 Mover IA</button>
          <button id="btn-undo-ai" class="btn btn-warning">✏️ Corregir Jugada IA</button>
          <button id="btn-reset" class="btn btn-danger">🔄 Nueva Partida</button>
        </div>
      </div>
      <!-- Panel de Entrenamiento "Guess the Move" -->
      <div id="trainer-panel" style="margin-top: 15px; padding: 15px; border: 1px solid #ccc; border-radius: 8px;">
        <h3>🎯 Entrenamiento: Guess the Move</h3>
        
        <textarea id="pgn-input" rows="4" style="width: 100%;" placeholder="Pega aquí el PGN de la partida de Gran Maestro..."></textarea>
        
        <div style="margin-top: 10px;">
          <label for="side-select">Bando:</label>
          <select id="side-select">
            <option value="w">Blancas</option>
            <option value="b">Negras</option>
          </select>

          <button onclick="startTraining()">Iniciar Entrenamiento</button>
          <button onclick="stopTraining()">Detener</button>
        </div>

        <div id="trainer-status" style="margin-top: 10px; font-weight: bold;">Carga un PGN para empezar.</div>
        <div id="trainer-score" style="margin-top: 5px; color: #2e7d32;">Puntuación: 0 / 0</div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script src="js/engine.js"></script>
  <script src="js/board.js"></script>
  <script src="js/app.js"></script>
  <script src="js/trainer.js"></script>
</body>
</html>
